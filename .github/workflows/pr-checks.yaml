name: PR checks

on:
  pull_request:
    branches:
      - main
      - v12

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

      - name: Test
        run: ./gradlew :backend:plugin:test

      # Non-blocking for now: `main` itself has pre-existing ktlint violations (ktlint was
      # configured but never actually enforced in CI here), so a hard gate today would fail
      # on unrelated code in every PR. This surfaces the check and its trend without blocking
      # merges. Run `./gradlew :backend:plugin:ktlintFormat` locally once to clear the existing
      # debt, then drop `continue-on-error` to make this a real gate against new violations.
      - name: Ktlint (informational — see comment above)
        run: ./gradlew :backend:plugin:ktlintCheck
        continue-on-error: true

  frontend-lint:
    name: Frontend lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Build plugin library
        run: npx ng build @valtimo-plugins/graph-mail
        working-directory: frontend

      - name: Test plugin library
        run: npx ng test @valtimo-plugins/graph-mail --browsers=ChromeHeadlessNoSandbox --watch=false
        working-directory: frontend
